name: Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - '*.lock'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@prosefly-pro'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PROSEFLY_PRO_API_KEY }}
        run: |
          pnpm install
          pnpm install @prosefly-pro/astro-openapi

      - name: Test package
        run: pnpm test

      - name: Prepare pro feature
        run: |
          mv .github/pro/api src/pages/
          mv .github/pro/cafe.yaml src/openapi.yaml
          cp ./astro.pro.ts ./astro.config.ts
          cp ./src/content.pro.ts ./src/content.config.ts

      - name: Check site
        run: pnpm check

      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
